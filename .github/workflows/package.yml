name: Build plugin package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [windows-x86_64, linux-x86_64, linux-aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Check opaque file transport
        run: python -B tests/test_file_transport.py
      - name: Check Responses file protocol
        run: python -B tests/test_responses_files.py
      - name: Build install ZIP
        run: python tools/package_plugin.py --bundle-platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: astrbot_plugin_wechat_hook-${{ matrix.platform }}
          path: dist/astrbot_plugin_wechat_hook.zip
          if-no-files-found: error
